<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-labelledby="title desc"><title id="title">cpc demo terminal recording</title><desc id="desc">The cpc demo command writes an agent-edit checkpoint in a temporary directory.</desc><rect width="720" height="260" fill="#101720"/><circle cx="26" cy="24" r="7" fill="#a7312e"/><circle cx="48" cy="24" r="7" fill="#e3ad60"/><circle cx="70" cy="24" r="7" fill="#23634d"/><g font-family="monospace" font-size="17" fill="#f4efdf"><text x="28" y="68" fill="#e3ad60">$ cargo run -- demo</text><text x="28" y="108">Demo checkpoint created in</text><text x="28" y="134" fill="#bcd7c5">/tmp/change-checkpoints-demo-172</text><text x="28" y="176">Open the manifest:</text><text x="28" y="202" fill="#bcd7c5">.change-checkpoints/agent-edit.json</text><text x="28" y="234" fill="#e3ad60">$</text></g></svg>
