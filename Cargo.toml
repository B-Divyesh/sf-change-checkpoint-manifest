[package]
name = "change-checkpoints"
version = "0.1.0"
edition = "2021"
description = "Portable, signed validation checkpoints for git workspaces"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-change-checkpoint-manifest"
readme = "README.md"
include = ["src/**", "examples/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "CHANGELOG.md"]

[[bin]]
name = "cpc"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
